services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ticket -d ticket
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6380:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: mailpit
    volumes:
    - ./backend:/app
    - media_files:/app/mediafiles
    - static_files:/app/staticfiles
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: mailpit
    volumes:
    - ./backend:/app
    - media_files:/app/mediafiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  celery_beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: mailpit
    volumes:
    - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file:
    - .env
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
    - ./web:/app
    - ./packages:/packages:ro
    - /app/node_modules
    ports:
    - 5173:5173
    depends_on:
    - backend
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
    - 127.0.0.1:1025:1025
    - 127.0.0.1:8025:8025
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 10s
      timeout: 5s
      retries: 3
  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: python manage.py migrate --noinput
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: null
  redis_data: null
  media_files: null
  static_files: null
