[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-backend"
version = "0.1.0"
description = "Ticket — Event management and ticketing platform backend"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "uvicorn[standard]==0.54.0",
    "djangorestframework==3.18.1",
    "django-filter==26.2",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "django-redis==7.0.0",
    "redis==8.1.0",
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "Pillow==12.3.0",
    "python-decouple==3.8",
    "qrcode[pil]==8.2",
    "reportlab==5.0.1",
    "Faker==40.40.0",
    "dj-database-url==3.1.2",
    "whitenoise==6.12.0",
    "structlog==26.1.0",
    "django-extensions==4.1",
]

[project.optional-dependencies]
stripe = [
    "stripe==16.0.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "factory-boy==3.3.3",
    "coverage==7.16.2",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==6.1.1",
    "djangorestframework-stubs==3.18.1",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--reuse-db",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
strict = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
