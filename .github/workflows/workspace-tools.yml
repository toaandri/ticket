name: Prepare offline workspace tools
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/workspace-tools.yml']
permissions:
  contents: read
jobs:
  postgres-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle PostgreSQL extension libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          tar -czf /tmp/postgres-extensions.tar.gz -C /usr/lib/postgresql/16 lib
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-extension-libraries
          path: /tmp/postgres-extensions.tar.gz
          retention-days: 3
