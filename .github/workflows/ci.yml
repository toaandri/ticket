name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, typecheck
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Backend: migrations + integration tests (PostgreSQL + Redis)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — migrations & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_test
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PAYMENT_PROVIDER: mock
      STRIPE_ENABLED: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for migration conflicts
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          coverage run -m pytest --tb=short -x
          coverage report

  # ---------------------------------------------------------------------------
  # Backend: OpenAPI schema drift check
  # ---------------------------------------------------------------------------
  schema-check:
    name: Backend — OpenAPI schema drift
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_test
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-schema-check-key
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PAYMENT_PROVIDER: mock
      STRIPE_ENABLED: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Generate schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema-generated.yml

      - name: Check schema drift (if committed schema exists)
        run: |
          if [ -f ../packages/api-client/generated/schema.yml ]; then
            diff /tmp/schema-generated.yml ../packages/api-client/generated/schema.yml && echo "Schema up to date." || (echo "Schema drift detected! Run 'make schema' to update." && exit 1)
          else
            echo "No committed schema yet — skipping drift check."
          fi

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, unit tests, build
  # ---------------------------------------------------------------------------
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present -- --run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Mobile: lint, typecheck, unit tests
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present -- --passWithNoTests

  # ---------------------------------------------------------------------------
  # Security: secret scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # non-blocking until baseline established
