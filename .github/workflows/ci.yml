name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, typecheck
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Domain type checks
        env:
          DEBUG: "True"
        run: mypy --explicit-package-bases apps/accounts/models.py apps/organizations/models.py apps/venues/models.py apps/events/models.py apps/inventory/models.py apps/reservations/models.py apps/orders/models.py apps/payments/models.py apps/tickets/models.py apps/checkins/models.py apps/payments/providers/base.py --follow-imports=silent

  # ---------------------------------------------------------------------------
  # Backend: migrations + integration tests (PostgreSQL + Redis)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — migrations & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_test
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PAYMENT_PROVIDER: mock
      STRIPE_ENABLED: "False"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .

      - name: Check for migration conflicts
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          coverage run --branch -m pytest --tb=short -x
          coverage report
          coverage report --include='apps/payments/services.py,apps/reservations/services.py,apps/orders/services.py,apps/checkins/services.py,apps/tickets/services.py' --fail-under=90

      - name: Repeat PostgreSQL races
        run: |
          for attempt in 1 2 3; do
            pytest tests/test_inventory.py tests/test_checkout.py -k 'race or concurrent or scanners' --tb=short -x
          done

  # ---------------------------------------------------------------------------
  # Backend: OpenAPI schema drift check
  # ---------------------------------------------------------------------------
  schema-check:
    name: Backend — OpenAPI schema drift
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_test
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-schema-check-key
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PAYMENT_PROVIDER: mock
      STRIPE_ENABLED: "False"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Generate schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema-generated.yml

      - name: Check schema drift (if committed schema exists)
        run: |
          if [ -f ../packages/api-client/generated/schema.yml ]; then
            diff /tmp/schema-generated.yml ../packages/api-client/generated/schema.yml && echo "Schema up to date." || (echo "Schema drift detected! Run 'make schema' to update." && exit 1)
          else
            echo "No committed schema yet — skipping drift check."
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Verify generated TypeScript contract
        run: |
          cd ../packages/api-client
          npm ci
          npm run generate
          git diff --exit-code -- generated/types.ts

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, unit tests, build
  # ---------------------------------------------------------------------------
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Mobile: lint, typecheck, unit tests
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Compile Expo Android bundle
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform android

  # ---------------------------------------------------------------------------
  # Security: secret scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        

  e2e:
    name: Real API browser journeys
    runs-on: ubuntu-latest
    needs: [backend-test, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ticket" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-synthetic-browser-key
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install and seed
        run: |
          pip install -r backend/requirements.lock
          pip install --no-deps --no-build-isolation -e backend
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_demo --password 'synthetic-demo-password-94!'
          npm ci --prefix web
          cd web && npx playwright install --with-deps chromium
      - name: Run journeys
        run: |
          (cd backend && uvicorn config.asgi:application --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1) &
          backend_pid=$!
          (cd web && npm run dev -- --host 127.0.0.1 > /tmp/web.log 2>&1) &
          web_pid=$!
          trap 'kill "$backend_pid" "$web_pid"' EXIT
          python infra/scripts/wait_for_http.py http://127.0.0.1:8000/api/health/ http://127.0.0.1:5173/
          cd web && npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            web/playwright-report/
            web/test-results/
            docs/screenshots/
          retention-days: 7

  dependency-audit:
    name: Dependency advisory review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.lock
      - run: npm ci --prefix web && npm audit --prefix web --omit=dev
      - run: npm ci --prefix mobile && python infra/scripts/audit_mobile.py
