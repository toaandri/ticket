components:
  schemas:
    AcceptanceResult:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - organization_id
      - role
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership_id:
          type: string
          format: uuid
      required:
      - id
      - membership_id
    AssignmentCreateRequest:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
      required:
      - membership_id
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 50
        entity_id:
          type: string
          format: uuid
        metadata_redacted: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity_id
      - id
    Availability:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        version:
          type: integer
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/BucketAvailability'
        seats:
          type: array
          items:
            $ref: '#/components/schemas/EventSeat'
      required:
      - event_id
      - seats
      - ticket_types
      - version
    BucketAvailability:
      type: object
      properties:
        ticket_type_id:
          type: string
          format: uuid
        capacity:
          type: integer
        held:
          type: integer
        sold:
          type: integer
        available:
          type: integer
      required:
      - available
      - capacity
      - held
      - sold
      - ticket_type_id
    CheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket_id:
          type: string
          format: uuid
          nullable: true
        event_id:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/ResultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_id
      - id
      - result
      - ticket_id
    CheckInCreateRequest:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        token:
          type: string
          minLength: 1
          maxLength: 2000
        device_id:
          type: string
          maxLength: 100
      required:
      - event_id
      - token
    CurrencyEnum:
      enum:
      - EUR
      - USD
      - MGA
      type: string
      description: |-
        * `EUR` - EUR
        * `USD` - USD
        * `MGA` - MGA
    DailySales:
      type: object
      properties:
        date:
          type: string
          format: date
        orders:
          type: integer
        gross_minor:
          type: integer
      required:
      - date
      - gross_minor
      - orders
    DeadLetter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          maxLength: 40
        aggregate_id:
          type: string
          format: uuid
        attempts:
          type: integer
          maximum: 2147483647
          minimum: 0
        failed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - aggregate_id
      - created_at
      - event_type
      - id
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        venue_id:
