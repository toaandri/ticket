components:
  schemas:
    AcceptanceResult:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - organization_id
      - role
    Availability:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        version:
          type: integer
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/BucketAvailability'
        seats:
          type: array
          items:
            $ref: '#/components/schemas/EventSeat'
      required:
      - event_id
      - seats
      - ticket_types
      - version
    BucketAvailability:
      type: object
      properties:
        ticket_type_id:
          type: string
          format: uuid
        capacity:
          type: integer
        held:
          type: integer
        sold:
          type: integer
        available:
          type: integer
      required:
      - available
      - capacity
      - held
      - sold
      - ticket_type_id
    CurrencyEnum:
      enum:
      - EUR
      - USD
      - MGA
      type: string
      description: |-
        * `EUR` - EUR
        * `USD` - USD
        * `MGA` - MGA
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        venue_id:
          type: string
          format: uuid
          nullable: true
        venue_name:
          type: string
          readOnly: true
          default: Online / to be announced
        city:
          type: string
          readOnly: true
          default: Online
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          maxLength: 50
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        event_timezone:
          type: string
          maxLength: 64
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
        seating_mode:
          $ref: '#/components/schemas/SeatingModeEnum'
        sales_start_at:
          type: string
          format: date-time
        sales_end_at:
          type: string
          format: date-time
        age_policy:
          type: string
          maxLength: 200
        cancellation_policy:
          type: string
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
          readOnly: true
      required:
